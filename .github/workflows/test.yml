name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 跑断言
        env:
          BOMCHECK_PRICEBOOK: pricebook.json
        run: python -m unittest discover -s tests -v
      - name: 核价冒烟
        env:
          BOMCHECK_PRICEBOOK: pricebook.json
        run: |
          python -m bomcheck.cli check data/bom-terminal-std.json --quote 4000
          python -m bomcheck.cli tiers data/bom-terminal-lite.json data/bom-terminal-std.json data/bom-terminal-rugged.json
