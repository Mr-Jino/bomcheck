[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bomcheck"
version = "1.0.0"
description = "硬件 BOM 核价器：把一份 BOM 拆成九项成本，每项都带算式"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mr-Jino", email = "Mr-Jino@users.noreply.github.com" }]
keywords = ["bom", "hardware", "cost", "quote", "teardown", "procurement"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.scripts]
bomcheck = "bomcheck.cli:main"

[project.urls]
Homepage = "https://github.com/Mr-Jino/bomcheck"

[tool.setuptools]
packages = ["bomcheck"]
